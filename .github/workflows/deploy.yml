name: Deploy Web, Desktop & Android Apps (Tauri & Capacitor)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ### JOB 1: Deploy website ke GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

  ### JOB 2: Kompilasi otomatis Tauri (.exe, .deb, .rpm, .pkg.tar.zst) dan Publish Release Resmi
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            args: "--bundles deb,rpm"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing version $VERSION..."
          npm version $VERSION --no-git-tag-version --allow-same-version || true
          npx json -I -f src-tauri/tauri.conf.json -e "this.version='$VERSION'" || true
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml || true

      - name: Sync Version from Git Tag (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG.TrimStart("v")
          Write-Host "Syncing version $VERSION on Windows..."
          npm version $VERSION --no-git-tag-version --allow-same-version
          (Get-Content src-tauri/tauri.conf.json) | ForEach-Object { $_ -replace '"version": ".*"', """version"": ""$VERSION""" } | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) | ForEach-Object { $_ -replace '^version = ".*"', "version = ""$VERSION""" } | Set-Content src-tauri/Cargo.toml

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          node scripts/generate-release-notes.mjs
          {
            echo 'body<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zstd rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build Tauri app & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "App Release ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create and upload Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node scripts/create-arch-pkg.mjs "$VERSION"
          gh release upload "${GITHUB_REF_NAME}" HK.UMKM-*.pkg.tar.zst --clobber

  ### JOB 3: Build APK Android & Attach ke Release
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Version from Git Tag to Android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          echo "Syncing version $VERSION (Code: $VERSION_CODE) to Android build.gradle & package.json..."
          npm version $VERSION --no-git-tag-version --allow-same-version || true
          npx json -I -f src-tauri/tauri.conf.json -e "this.version='$VERSION'" || true
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml || true
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle || true
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle || true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}